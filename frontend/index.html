<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CO OP</title>
  <meta name="description" content="CO OP — AI-powered business management. Products, inventory, customers, orders and AI insights." />
  <link rel="icon" type="image/svg+xml" href="./coop-mark.svg" />
  <style>
    /* Boot loader: equalizer bars, shown until React mounts. */
    .boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--coop-surface,#fcf8ff);}
    .loader{width:45px;aspect-ratio:.75;--c:no-repeat linear-gradient(#4143d5 0 0);
      background:var(--c) 0% 100%,var(--c) 50% 100%,var(--c) 100% 100%;
      background-size:20% 65%;animation:l5 1s infinite linear;}
    @keyframes l5{
      20%{background-position:0% 50%,50% 100%,100% 100%}
      40%{background-position:0% 0%,50% 50%,100% 100%}
      60%{background-position:0% 100%,50% 0%,100% 50%}
      80%{background-position:0% 100%,50% 100%,100% 0%}
    }
  </style>
</head>
<body>
  <div id="root"><div class="boot"><div class="loader"></div></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
