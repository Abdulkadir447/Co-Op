server {
    listen 3000;
    server_name localhost;
    # Don't advertise the nginx version on error pages and Server headers.
    server_tokens off;
    # Logo uploads are capped at 5 MB in storage.py; leave headroom, not a hole.
    client_max_body_size 10m;

    # ---------------------------------------------------------------------
    # Security headers (OWASP secure-headers baseline).
    #
    # These live here, not only in the API, because the API's middleware can
    # only protect API responses — the document that actually runs the React
    # app is served by THIS server. A CSP set on /api protects nothing.
    #
    # script-src is 'self' with no 'unsafe-inline' and no 'unsafe-eval':
    # index.html has no inline <script>, and Vite emits hashed module files,
    # so this holds without a nonce (a static file server cannot mint one per
    # request). Clerk's browser bundle is fetched from the instance's Frontend
    # API host, which is why *.clerk.accounts.dev is allowed — add your own
    # custom Clerk domain here if you configure one.
    #
    # style-src needs 'unsafe-inline': Ant Design injects component styles at
    # runtime via style attributes. That is a real, accepted trade-off —
    # inline STYLE is far lower risk than inline SCRIPT, and it is the only
    # way to keep the design system working.
    # ---------------------------------------------------------------------
    set $csp "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://img.clerk.com; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://*.supabase.co; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Isolate the browsing context: no cross-origin opener/window leakage.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS is meaningful only when this is reached over TLS (a terminating
    # proxy in front). Harmless on plain http: browsers ignore it there.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Proxy the Co-op API to the backend service (Task 11 / audit C3).
    # Mirrors the Vite dev-server rewrite: /api/<path> -> backend:/<path>.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Authenticated JSON must never sit in a shared cache or the bfcache:
        # one owner's receivables must not be replayed to the next person on
        # the same machine. `always` keeps it on error responses too.
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # Hashed build assets are immutable and may be cached aggressively.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # The shell must revalidate, or an update ships stale HTML pointing at
        # deleted asset hashes (a white screen after every deploy).
        add_header Cache-Control "no-cache" always;
    }
}
