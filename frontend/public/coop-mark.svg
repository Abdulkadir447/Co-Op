<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="CO OP mark">
  <!--
    CO OP mark — "the weave". Three overlapping rounded petals (inventory,
    orders, customers) joining into one, with a white core. Transparent
    background so it sits cleanly on light and dark surfaces.
  -->
  <defs>
    <linearGradient id="coopA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5fef"/>
      <stop offset="1" stop-color="#4143d5"/>
    </linearGradient>
    <linearGradient id="coopB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4cfc"/>
      <stop offset="1" stop-color="#712ae2"/>
    </linearGradient>
    <linearGradient id="coopC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0c1ff"/>
      <stop offset="1" stop-color="#8a8df5"/>
    </linearGradient>
  </defs>
  <rect x="14" y="5" width="20" height="21" rx="9" fill="url(#coopA)"/>
  <rect x="6" y="19" width="20" height="21" rx="9" fill="url(#coopB)" opacity="0.94"/>
  <rect x="22" y="19" width="20" height="21" rx="9" fill="url(#coopC)" opacity="0.9"/>
  <path d="M24 17 Q26.6 22.4 30.5 25 Q26.6 27.6 24 33 Q21.4 27.6 17.5 25 Q21.4 22.4 24 17 Z"
        fill="#ffffff" opacity="0.96"/>
</svg>
