<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Co-op">
  <!--
    Co-op mark, single colour — for print, embroidery, stamps, one-colour
    signage and anywhere a gradient cannot be reproduced. The crate is knocked
    out of the ring with a 3.2-unit gap so the two shapes stay separate when
    they share a colour; that gap is the whole design, do not close it.
  -->
  <mask id="coopMonoGap">
    <rect width="48" height="48" fill="#fff"/>
    <rect x="18.2" y="14" width="21.6" height="20" rx="7.4" fill="#000"/>
  </mask>
  <path d="M33.4 13.2 A14.2 14.2 0 1 0 33.4 34.8" fill="none" stroke="currentColor" stroke-width="6.8" stroke-linecap="round" mask="url(#coopMonoGap)"/>
  <rect x="21.4" y="17.2" width="15.2" height="13.6" rx="4.8" fill="currentColor"/>
</svg>
