name: CI

# Co-op's enforced gates. Every command below is the exact command that is
# green on the current tree — run them locally the same way and you get the
# same answer:
#
#   backend    — ruff (E/F/W, line-length 100) + the full pytest suite.
#                pytest MUST run from the repo root: pytest.ini sets
#                testpaths=backend/tests and pythonpath=., and the suite
#                imports `backend.*`. `cd backend && pytest tests/` cannot
#                work.
#   frontend   — eslint + tsc + the local-analytics port tests + a build.
#   desktop    — the Electron data-layer/sync/backup suite, ON WINDOWS: the
#                desktop build ships to Windows, and electron/test/windows.test.js
#                has a group that only runs on a real Windows filesystem. The
#                job fails if those tests were skipped, so the Windows checks
#                cannot silently rot.
#   commitlint — conventional-commit shape of every commit in a PR.
#
# Deliberately absent, because a gate that cannot pass does not belong in CI
# (see docs/PRODUCT_READINESS.md §4 — format/type gates are grandfathered):
#   * `prettier --check` — 128 existing src files fail it.
#   * black / mypy / flake8 — replaced by ruff (pyproject.toml).
#   * Snyk/bandit scans that end in `|| true` — a check that cannot fail
#     informs nobody and only costs minutes.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff E/F/W)
        run: ruff check backend/

      - name: Test suite (incl. the frontend<->backend contract test)
        run: python -m pytest

  frontend:
    name: Frontend lint + types + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter ./frontend lint

      - name: Type check
        run: pnpm --filter ./frontend typecheck

      - name: Unit tests (local analytics port fidelity)
        run: pnpm --filter ./frontend test

      - name: Production build
        run: pnpm --filter ./frontend build

  desktop:
    name: Desktop data layer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No install step: the suite pins the built-in node:sqlite engine
      # (db/driver.js falls back to it when better-sqlite3 is absent), so it
      # runs on a bare Node 22.
      - name: Electron suite incl. the Windows-only group
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -Variable out | Out-Host
          $text = $out -join "`n"
          if ($text -notmatch '(?m)^# fail 0\s*$') { throw 'Desktop suite failures.' }
          if ($text -notmatch '(?m)^# skipped 0\s*$') {
            throw 'The Windows-only tests were skipped on a Windows runner - they must run here.'
          }

  commitlint:
    name: Commit messages (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
