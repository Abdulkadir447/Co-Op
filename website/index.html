<!doctype html>
<html lang="en" data-type="software">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Co-op — the operating system for small businesses</title>
    <meta name="description" content="Co-op is an offline-first inventory, orders, customers and AI assistant for Nigerian retail: products, stock, orders and invoices in one desktop app. Start your free trial." />
    <!-- Page classification the design-taste skill reads (and which keeps the
         page honest about what it is: a software product, not a place). -->
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />

    <!-- Sharing. WhatsApp is the primary channel in this market, and without
         these every shared link renders as a bare URL.
         Deliberately missing: canonical, og:url and og:image. All three need a
         real absolute production URL, and inventing one would put a wrong
         domain (or a broken preview image) in front of every shared link.
         Add them together with public/og.png once the domain is fixed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Co-op" />
    <meta property="og:title" content="Co-op — run your whole business from one calm place" />
    <meta property="og:description" content="Inventory, orders, customers and invoicing in one offline-first desktop app, with an assistant that explains your numbers. Built for Nigerian retail." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Co-op — run your whole business from one calm place" />
    <meta name="twitter:description" content="Inventory, orders, customers and invoicing in one offline-first desktop app. Built for Nigerian retail." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#4143d5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Boot loader: shown until React mounts. Animation per the approved design. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fcf8ff; }
      .loader {
        width: 45px;
        aspect-ratio: .75;
        --c: no-repeat linear-gradient(#4143d5 0 0);
        background:
          var(--c) 0%   100%,
          var(--c) 50%  100%,
          var(--c) 100% 100%;
        background-size: 20% 65%;
        animation: l5 1s infinite linear;
      }
      @keyframes l5 {
        20% {background-position: 0% 50% ,50% 100%,100% 100%}
        40% {background-position: 0% 0%  ,50% 50% ,100% 100%}
        60% {background-position: 0% 100%,50% 0%  ,100% 50% }
        80% {background-position: 0% 100%,50% 100%,100% 0%  }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div class="loader"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
