<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Co-op - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#311300",
                        "on-primary-fixed": "#05006c",
                        "inverse-on-surface": "#f2effc",
                        "secondary": "#712ae2",
                        "on-secondary-fixed": "#25005a",
                        "outline": "#767586",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-surface": "#1b1b23",
                        "on-surface-variant": "#464555",
                        "surface-container-high": "#e9e6f3",
                        "on-primary-container": "#f9f6ff",
                        "error-container": "#ffdad6",
                        "primary-container": "#5b5fef",
                        "outline-variant": "#c6c5d7",
                        "secondary-fixed-dim": "#d2bbff",
                        "surface-container-low": "#f5f2fe",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fcf8ff",
                        "surface-variant": "#e4e1ed",
                        "inverse-surface": "#303039",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fcf8ff",
                        "tertiary": "#904400",
                        "error": "#ba1a1a",
                        "inverse-primary": "#c0c1ff",
                        "on-primary-fixed-variant": "#2c2cc3",
                        "secondary-container": "#8a4cfc",
                        "surface-tint": "#474adb",
                        "tertiary-container": "#b55700",
                        "secondary-fixed": "#eaddff",
                        "surface-container": "#efecf9",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#733500",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e4e1ed",
                        "on-background": "#1b1b23",
                        "surface-dim": "#dbd8e5",
                        "tertiary-fixed": "#ffdbc8",
                        "tertiary-fixed-dim": "#ffb689",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "primary": "#4143d5",
                        "on-tertiary-container": "#fff6f2",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-container": "#fffbff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "2xl": "48px",
                        "md": "16px",
                        "3xl": "64px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "section-heading": ["Inter"],
                        "body-compact": ["Inter"],
                        "page-title-mobile": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-default": ["Inter"],
                        "page-title": ["Inter"]
                    },
                    "fontSize": {
                        "section-heading": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-compact": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "page-title-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-default": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "page-title": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-default min-h-screen flex items-center justify-center p-md sm:p-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm">
<!-- Header -->
<div class="text-center mb-xl">
<div class="flex justify-center items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-section-heading text-section-heading text-primary">Co-op</span>
</div>
<h1 class="font-page-title-mobile sm:font-page-title text-page-title-mobile sm:text-page-title text-on-surface mb-sm">Create an Account</h1>
<p class="font-body-default text-body-default text-on-surface-variant">Join Co-op to start optimizing your SaaS operations.</p>
</div>
<!-- Sign Up Form -->
<form class="space-y-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">person</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed/50 outline-none transition-all font-body-default text-body-default text-on-surface placeholder:text-outline-variant" id="fullName" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">mail</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed/50 outline-none transition-all font-body-default text-body-default text-on-surface placeholder:text-outline-variant" id="email" placeholder="jane@company.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-size: 20px;">lock</span>
<input class="w-full pl-[36px] pr-sm py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed/50 outline-none transition-all font-body-default text-body-default text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-2 bg-surface-container-lowest cursor-pointer" id="terms" type="checkbox">
</div>
<div class="flex-1">
<label class="font-body-compact text-body-compact text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline font-bold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-bold" href="#">Privacy Policy</a>.
                    </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps rounded-xl transition-all duration-200 active:scale-95 shadow-sm mt-lg flex items-center justify-center" type="button">
                Create Account
            </button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-md text-on-surface-variant font-label-caps text-label-caps uppercase">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Sign Up -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm h-[48px] rounded-xl border border-outline-variant bg-transparent hover:bg-surface-container-low transition-colors font-label-caps text-label-caps text-on-surface active:scale-95" type="button">
<span class="material-symbols-outlined text-on-surface" style="font-size: 20px;">g_mobiledata</span>
                Google
            </button>
<button class="flex items-center justify-center gap-sm h-[48px] rounded-xl border border-outline-variant bg-transparent hover:bg-surface-container-low transition-colors font-label-caps text-label-caps text-on-surface active:scale-95" type="button">
<span class="material-symbols-outlined text-on-surface" style="font-size: 20px;">work</span>
                Microsoft
            </button>
</div>
<!-- Sign In Link -->
<div class="mt-xl text-center">
<p class="font-body-default text-body-default text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:underline font-bold" href="#">Sign in here</a>
</p>
</div>
</div>
</body></html>
