<body class="bg-mesh min-h-screen flex items-center justify-center p-md lg:p-2xl antialiased font-body-default text-on-background">
<!-- Main Container - Suppressing navigation shell for this transactional state -->
<main class="w-full max-w-md flex flex-col items-center">
<!-- Top Action / Brand Area -->
<div class="w-full flex justify-between items-center mb-xl">
<!-- Back Action -->
<button class="group flex items-center gap-xs px-sm py-xs -ml-sm rounded-lg hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary/50 text-on-surface-variant hover:text-primary">
<span aria-hidden="true" class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
<span class="font-body-compact text-body-compact">Sign In</span>
</button>
<!-- Brand Logo Mark (Textual) -->
<div class="font-section-heading text-section-heading text-primary font-bold">
                Co-op
            </div>
</div>
<!-- Card Layer -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-[12px] p-lg shadow-soft-indigo flex flex-col gap-xl">
<!-- Header Text -->
<header class="flex flex-col gap-sm text-center">
<h1 class="font-page-title-mobile text-page-title-mobile md:font-page-title md:text-page-title text-on-surface">
                    Reset password
                </h1>
<p class="font-body-default text-body-default text-on-surface-variant max-w-[90%] mx-auto">
                    Enter the email associated with your account, and we'll send you secure instructions to reset your password.
                </p>
</header>
<!-- Form Area -->
<form action="#" class="flex flex-col gap-lg" method="POST" onsubmit="event.preventDefault(); alert('Reset link sent!');">
<!-- Input Group -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">
                        Email Address
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-[36px] pr-sm py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-default text-body-default placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed/50 transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Submit Action -->
<button class="w-full h-[48px] flex items-center justify-center gap-sm bg-primary hover:bg-primary-container text-on-primary hover:text-on-primary-container rounded-xl transition-all shadow-[0_4px_12px_rgba(65,67,213,0.15)] active:scale-[0.98] active:shadow-none focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
<span class="font-label-caps text-label-caps">Send Reset Link</span>
<span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<p class="font-body-compact text-body-compact text-on-surface-variant">
                    Having trouble? <a class="text-primary hover:text-secondary underline decoration-primary/30 hover:decoration-secondary transition-colors" href="#">Contact Support</a>
</p>
