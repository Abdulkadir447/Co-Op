# gitleaks configuration — secret scanning for a PUBLIC repository.
#
# The default ruleset is kept (extend.useDefault) and only narrowed where this
# repo legitimately contains a *placeholder* that looks like a credential:
# docs and .env.example teach people what to paste, so they contain shapes like
# `postgresql://user:<password>@host` and `SUPABASE_SERVICE_ROLE_KEY="<key>"`.
#
# Every entry below is a literal angle-bracket placeholder or the container-only
# development password. A real key would not match these paths AND values.

title = "Co-op"
[extend]
useDefault = true

[[rules]]
id = "coop-placeholder-credentials"
description = "Documentation placeholders that are not credentials"
regex = '''<password>|<service_role key>|<your-api>|coop_password|pk_test_\.\.\.|sk_test_\.\.\.'''
paths = ['''docs/.*\.md''', '''.*\.example''', '''supabase/.*\.md''', '''podman-compose\.yml''']
